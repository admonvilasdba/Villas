databases:
  - name: vilas-db
    plan: free
    databaseName: vilas
    user: vilas

services:
  - type: web
    name: vilas-carta
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn vilas_carta.wsgi:application --workers 2 --bind 0.0.0.0:$PORT'
    envVars:
      - key: PYTHON_VERSION
        value: '3.14.6'
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        fromDatabase:
          name: vilas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: TIME_ZONE
        value: 'America/Mexico_City'
