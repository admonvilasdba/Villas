services:
  - type: web
    name: vilas-carta
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn vilas_carta.wsgi:application --workers 2 --bind 0.0.0.0:$PORT'
    envVars:
      - key: PYTHON_VERSION
        value: '3.14.6'
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: TIME_ZONE
        value: 'America/Mexico_City'
